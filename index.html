                <feDropShadow dx="8" dy="14" stdDeviation="7" flood-color="#14162a" flood-opacity="0.42" />

            <g class="layer" data-depth="6" fill="var(--shade)" filter="url(#paper-shadow)">
              <circle cx="760" cy="90" r="110" />

            <g class="layer" data-depth="18">
              <g class="figures">
                <path d="M556 470 C548 372 582 316 610 288 C636 320 650 382 640 470 Z" fill="var(--figure)" />
                <path d="M644 470 C640 382 664 322 688 300 C716 330 730 390 718 470 Z" fill="var(--figure)" />
                <circle cx="610" cy="264" r="29" fill="var(--accent)" />
                <circle cx="692" cy="276" r="29" fill="var(--accent)" />
              </g>
            </g>

            <g class="layer" data-depth="28" fill="var(--sheet)" filter="url(#paper-shadow)">
              <rect x="-60" y="480" width="1060" height="180" />
              <circle cx="100" cy="540" r="150" />
              <circle cx="250" cy="500" r="120" />

        <div class="intro">
          <div>
            <span class="en-sub">STATEMENT</span>
            <h1>曾怡柔</h1>
            <p class="tagline">會死嗎 不知道</p>

            <p>

              這是我的作品集網站。
            </p>
            <a class="button" href="works.html">我的作品 ➔</a>
          </div>
        </div>

        <section aria-labelledby="film-heading">
          <div class="feature">
            <img src="images/still-folds.webp" width="960" height="540" alt="《藍夜》畫面：藍色紙偶在白色摺紙線條之間" />
            <div class="feature-body">
              <span class="en-sub">VIDEO</span>
              <h2 id="film-heading">《藍夜》</h2>
              <p class="lede">定格動畫。好累喔 但很好玩。</p>
